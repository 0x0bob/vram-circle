name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build
        run: forge build --sizes

      - name: forge test (invariants at 1,000 runs)
        env:
          FOUNDRY_INVARIANT_RUNS: "1000"
        run: forge test -vvv

      - name: forge snapshot --check
        run: forge snapshot --check

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install slither-analyzer

      # Fails on high and medium findings. The one approved suppression
      # (incident: FeeRouter incorrect-equality) is an inline slither-disable comment.
      - name: Slither
        run: slither . --exclude-dependencies --fail-medium

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: forge build (source of the generated ABIs)
        run: forge build

      - name: Generated ABIs are up to date
        run: |
          node scripts/gen-abis.mjs
          git diff --exit-code -- app/src/generated/abis.ts || {
            echo "::error::app/src/generated/abis.ts is out of date. Run: forge build && node scripts/gen-abis.mjs"
            exit 1
          }

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Typecheck
        run: npm run typecheck
        working-directory: app

      - name: Unit and component tests (Vitest)
        run: npm test
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: app

      - name: End-to-end test on Anvil
        run: node scripts/e2e.mjs
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
